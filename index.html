<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173f2a" />
    <meta name="description" content="AI property operations and rent recovery for independent landlords and property managers." />
    <title>RentPilot AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('click', function (event) {
        var button = event.target.closest && event.target.closest('.nova-full-activity');
        if (!button) return;
        setTimeout(function () {
          var drawer = document.querySelector('.nova-drawer');
          if (drawer) {
            var close = drawer.querySelector('.nova-head > button');
            if (close) close.click();
          }
          var activity = document.querySelector('.activity-column');
          if (activity) activity.scrollIntoView({behavior:'smooth', block:'start'});
        }, 120);
      }, true);
    </script>
  </body>
</html>
